<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Crown Limousine - Austin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        
        header {
            background: #1a2333;
            color: white;
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .logo img { height: 70px; width: auto; }
        
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://via.placeholder.com/1920x1080/1a2333/c5a05b?text=Black+Crown+Limousine+Austin') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            margin-top: 80px;
        }
        .hero h1 { font-size: 3rem; margin-bottom: 20px; }
        .hero p { font-size: 1.4rem; margin-bottom: 30px; }
        .btn {
            background: #c5a05b;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="logo">
                <img src="logo.png" alt="Black Crown Limousine">
            </a>
            <div>
                <a href="#services" style="color:white; margin:0 15px; text-decoration:none;">Services</a>
                <a href="#fleet" style="color:white; margin:0 15px; text-decoration:none;">Fleet</a>
                <a href="#contact" style="color:white; margin:0 15px; text-decoration:none;">Contact</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h1>Premium Car & Limo Service in Austin</h1>
            <p>Serving Austin & Central Texas</p>
            <a href="#contact" class="btn">Book Your Ride Now</a>
        </div>
    </section>

</body>
</html>
